services:
  postgres:
    container_name: httpsms-postgres
    image: postgres:16
    environment:
      POSTGRES_DB: httpsms
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_USER: dbusername
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbusername -d httpsms"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 5s

  redis:
    container_name: httpsms-redis
    image: redis:latest
    command: redis-server
    volumes:
      - redis:/var/lib/redis
    ports:
      - "6379:6379"
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    container_name: httpsms-api
    build:
      context: ./api
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./api/.env
    dns:
      - 8.8.8.8
      - 1.1.1.1

  web:
    container_name: httpsms-web
    build:
      context: ./web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  redis:
  postgres:
